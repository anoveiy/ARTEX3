# Managed by ForkSync
name: ForkSync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  SYNC_BRANCH: "main"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: "forksync-main"
      cancel-in-progress: false
    steps:
      - name: Merge upstream without overwriting fork changes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch="$SYNC_BRANCH"
